services:
  - type: web
    name: privlock-api
    runtime: docker
    dockerContext: ./PII
    dockerfilePath: ./PII/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: USE_SQLITE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:*"
      - key: FRONTEND_URL
        sync: false
