services:
  - type: web
    name: privlock-api
    runtime: docker
    dockerContext: ./PII
    dockerfilePath: ./PII/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:*"
      - key: FRONTEND_URL
        sync: false
